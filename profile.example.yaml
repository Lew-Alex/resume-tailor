# Example master profile. On first run this is copied to data/profile.yaml
# (which is git-ignored, so your real data never gets committed).
# Put EVERYTHING here; the tailoring step decides what goes on each resume.
#
# Bullet fields:
#   text            the bullet as it would appear on the resume (**bold** allowed)
#   tags            free-form keywords that help matching
#   evidence        implemented | experiment | planned   (planned never goes on a tailored resume)
#   status          approved | draft                     (drafts never go on a tailored resume)
#   groups          bullets sharing a group are alternative wordings; a resume uses at most one
#   metrics_needed  true if the bullet would be stronger with a number you haven't given yet

